theme = "enterprise_black"

[editor]
true-color = true
cursorline = false
bufferline = "always"
mouse = true
idle-timeout = 0
insert-mode = true

auto-format = true
color-modes = true

line-number = "relative"
gutters = ["diagnostics", "line-numbers", "diff"]

scrolloff = 8
completion-timeout = 0

# Syntax-friendly vertical guide at column 80
rulers = [81]

[editor.soft-wrap]
enable = true
wrap-indicator = ""

# [editor.whitespace]
# render = true

[editor.indent-guides]
render = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-messages = true

# === INSERT MODE NAVIGATION ===
[keys.insert]
# Movement (arrow keys)
C-h = "move_char_left"
C-l = "move_char_right"
C-j = "move_line_down"
C-k = "move_line_up"
C-a = "goto_line_start"
C-e = "goto_line_end"

# Word navigation
C-b = "move_prev_word_start"
C-w = "move_next_word_start"

# Page navigation (avoid C-y, C-v conflicts)
C-u = "page_up"
C-d = "page_down"

# File navigation (use shifted variants to avoid conflicts)
# C-n = "goto_last_line"        # Ctrl+n = bottom of file
# C-p = "goto_first_line"       # Ctrl+p = top of file (also keeps paste)

# Editing
C-s = ":w"                 # Save
C-z = "undo"                  # Undo
C-x = "redo"                  # Redo

# Clipboard (use different keys to avoid terminal paste)
C-c = "yank"                  # Copy
C-v = "paste_after"           # Paste (override terminal paste)

# Other
C-m = "insert_newline"        # Newline

# === DISABLE NORMAL MODE SWITCHING ===
[keys.normal]
# Disable everything that enters normal mode
"esc"     = "no_op"
"C-c"     = "no_op"
"C-["     = "no_op"
