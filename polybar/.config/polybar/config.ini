[colors]
background = #0a0a0a
background-alt = #161a1d
foreground = #e9e9e9
primary = #557b93
secondary = #0197bb
alert = #e90000
disabled = #5a5a5a

[bar/example]
width = 100%
height = 24pt
radius = 0
tray-position = right 
tray-padding = 2
tray-background = ${colors.background}
tray-foreground = ${colors.foreground}
tray-maxsize = 16
tray-offset-x = 0
tray-offset-y = 0
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 1pt
border-color = ${colors.background}

padding-left = 0
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = AdwaitaMono;1

modules-left = xworkspaces 
modules-right = pulseaudio mpris xkeyboard memory cpu battery date 

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = true

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/wlan]
type = internal/network
interval = 5
interface-type = wireless
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F${colors.primary}}%ifname%%{F${colors.disabled}} disconnected
label-connected = %{F${colors.primary}}%ifname%%{F-} %essid% %local_ip%

[module/date]
type = internal/date
interval = 1
date = %H:%M |
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC1
full-at = 98
poll-interval = 5

format-charging = CHR <label-charging>
format-discharging = BAT <label-discharging>
format-full = Battery: FULL

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 100%

format-low = Battery: <label-low>
label-low = %percentage%% LOW
label-low-foreground = ${colors.alert}

[module/mpris]
type = custom/script
interval = 2
exec = playerctl metadata --format "{{emoji(status)}} {{artist}}" 2>/dev/null || echo ""
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous
label = %output%
label-maxlen = 50
format-foreground = ${colors.foreground}
format-padding = 2

[settings]
screenchange-reload = true
pseudo-transparency = true
