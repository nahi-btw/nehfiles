# Basic Settings
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

#Le_prefix
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Split windows
unbind %
bind v split-window -h -c "#{pane_current_path}"

unbind '"'
bind s split-window -v -c "#{pane_current_path}"

bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"
# Reload config
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Alt+hjkl to switch panes without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Prefix+hjkl just in case
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fix the index
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Window Switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Enterprise-Black Colorscheme
# Based on the enterprise-black palette

# Status bar colors
set -g status-style "bg=#0a0a0a,fg=#e9e9e9"

# Left status segment
set -g status-left-style "bg=#0a0a0a,fg=#557b93"
set -g status-left "#[fg=#0197bb,bg=#0a0a0a] ❐ #[fg=#e9e9e9,bg=#0a0a0a] #S "

# Right status segment
set -g status-right-style "bg=#0a0a0a,fg=#557b93"
set -g status-right "#[fg=#e9e9e9,bg=#0a0a0a] %H:%M #[fg=#557b93,bg=#0a0a0a]|#[fg=#e9e9e9,bg=#0a0a0a] %d-%b-%y #[fg=#0197bb,bg=#0a0a0a] #(whoami) "

# Window status
set -g window-status-style "bg=#0a0a0a,fg=#5a5a5a"
set -g window-status-current-style "bg=#0a0a0a,fg=#e9e9e9"

# Window status format
set -g window-status-format "#[fg=#5a5a5a,bg=#0a0a0a] #I:#W "
set -g window-status-current-format "#[fg=#e9e9e9,bg=#0a0a0a] #I:#W "

# Pane borders
set -g pane-border-style "fg=#161a1d"
set -g pane-active-border-style "fg=#557b93"

# Message and command styles
set -g message-style "bg=#0a0a0a,fg=#e9e9e9"
set -g message-command-style "bg=#0a0a0a,fg=#e9e9e9"

# Mode (copy/scroll) style
set -g mode-style "bg=#557b93,fg=#0a0a0a"  
set -g status-position top
