#################################
#       Backend & VSync         #
#################################
backend = "glx";
vsync = true;
unredir-if-possible = true;

#################################
#          Shadows              #
#################################
shadow = true;
shadow-radius = 7;
shadow-opacity = 0.7;

shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "_GTK_FRAME_EXTENTS@"
];

#################################
#          Blur                 #
#################################
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-frame = true;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "class_g = 'slop'",
    "class_g = 'maim'",
    "class_g = 'scrot'",
    "_GTK_FRAME_EXTENTS@"
];

#################################
#       Rounded Corners         #
#################################
rounded-corners = true;
corner-radius = 10;

# Exclude things that shouldn't have rounded corners
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'",
    "_GTK_FRAME_EXTENTS@"
];

#################################
#      Fading & Opacity         #
#################################
fading = false;
inactive-dim = 0.1;
frame-opacity = 0.9;
inactive-opacity-override = false;

active-opacity = 0.9;
inactive-opacity = 0.85;

opacity-rule = [
    "75:class_g = 'Alacritty'",
    "90:class_g = 'kitty'",
    "90:class_g = 'URxvt'",
    "90:class_g = 'XTerm'",
    "90:class_g = 'gnome-terminal'",

    "95:class_g = 'Firefox'",
    "95:class_g = 'firefox'",
    "95:class_g = 'Chromium'",
    "95:class_g = 'Google-chrome'",
    "95:class_g = 'Brave-browser'",

    "90:class_g = 'Code'",
    "90:class_g = 'code-oss'",
    "90:class_g = 'VSCodium'",

    "85:class_g = 'Rofi'",
    "85:class_g = 'rofi'",

    "95:class_g = 'Thunar'",
    "95:class_g = 'Nautilus'",
    "95:class_g = 'pcmanfm'",
    "95:class_g = 'dolphin'",

    "100:class_g = 'mpv'",
    "100:class_g = 'vlc'",

    "100:fullscreen"
];

#################################
#          Performance          #
#################################
use-damage = true;
no-ui-font = true;

#################################
#       Fading & Opacity        #
#################################

fading = true;

# Smaller values produce smoother, slower fades.
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;

inactive-dim = 0.1;
frame-opacity = 0.9;
inactive-opacity-override = false;

active-opacity = 0.9;
inactive-opacity = 0.85;
